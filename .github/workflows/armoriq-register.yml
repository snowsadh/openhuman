name: Validate and register ArmorIQ agents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/armoriq/**"
      - ".github/workflows/armoriq-register.yml"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    environment: production
    env:
      ARMORIQ_API_KEY: ${{ secrets.ARMORIQ_API_KEY }}
      ARMORIQ_MCP_BEARER_TOKEN: ${{ secrets.ARMORIQ_MCP_BEARER_TOKEN }}
      ARMORIQ_GENERAL_MCP_URL: ${{ vars.ARMORIQ_GENERAL_MCP_URL }}
      ARMORIQ_HR_MCP_URL: ${{ vars.ARMORIQ_HR_MCP_URL }}
      ARMORIQ_SALES_MCP_URL: ${{ vars.ARMORIQ_SALES_MCP_URL }}
      ARMORIQ_SUPPORT_MCP_URL: ${{ vars.ARMORIQ_SUPPORT_MCP_URL }}
      ARMORIQ_LEGAL_MCP_URL: ${{ vars.ARMORIQ_LEGAL_MCP_URL }}
      ARMORIQ_N8N_RELAY_MCP_URL: ${{ vars.ARMORIQ_N8N_RELAY_MCP_URL }}
      ARMORIQ_ZENDESK_MCP_URL: ${{ vars.ARMORIQ_ZENDESK_MCP_URL }}
      ARMORIQ_SLACK_VALIDATION_TOKEN: ${{ secrets.ARMORIQ_SLACK_VALIDATION_TOKEN }}
      ARMORIQ_GMAIL_VALIDATION_TOKEN: ${{ secrets.ARMORIQ_GMAIL_VALIDATION_TOKEN }}
      ARMORIQ_GOOGLE_CALENDAR_VALIDATION_TOKEN: ${{ secrets.ARMORIQ_GOOGLE_CALENDAR_VALIDATION_TOKEN }}
      ARMORIQ_GITHUB_VALIDATION_TOKEN: ${{ secrets.ARMORIQ_GITHUB_VALIDATION_TOKEN }}
      ARMORIQ_NOTION_VALIDATION_TOKEN: ${{ secrets.ARMORIQ_NOTION_VALIDATION_TOKEN }}
      ARMORIQ_HUBSPOT_VALIDATION_TOKEN: ${{ secrets.ARMORIQ_HUBSPOT_VALIDATION_TOKEN }}
      ARMORIQ_CANVA_VALIDATION_TOKEN: ${{ secrets.ARMORIQ_CANVA_VALIDATION_TOKEN }}
      ARMORIQ_N8N_VALIDATION_CREDENTIAL: ${{ secrets.ARMORIQ_N8N_VALIDATION_CREDENTIAL }}
      ARMORIQ_ZENDESK_VALIDATION_CREDENTIAL: ${{ secrets.ARMORIQ_ZENDESK_VALIDATION_CREDENTIAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install pinned ArmorIQ CLI
        run: pip install "armoriq-sdk==0.6.9"
      - name: Validate and register production agents
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          for config in deploy/armoriq/production/*.yaml; do
            armoriq validate --config "$config"

            registered=false
            for attempt in 1 2 3 4; do
              if armoriq register --config "$config"; then
                registered=true
                break
              fi

              if [ "$attempt" -lt 4 ]; then
                delay=$((5 * (2 ** (attempt - 1))))
                echo "ArmorIQ registration attempt $attempt failed for $config; retrying in ${delay}s"
                sleep "$delay"
              fi
            done

            if [ "$registered" != true ]; then
              failures+=("$config")
              echo "::error file=$config::ArmorIQ registration failed after 4 attempts"
            fi
          done

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'ArmorIQ registration failed for: %s\n' "${failures[*]}"
            exit 1
          fi
      - name: Restore ArmorIQ policy credentials
        env:
          ARMORIQ_CLI_CREDENTIALS_B64: ${{ secrets.ARMORIQ_CLI_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.armoriq"
          printf '%s' "$ARMORIQ_CLI_CREDENTIALS_B64" | base64 --decode > "$HOME/.armoriq/credentials.json"
          chmod 600 "$HOME/.armoriq/credentials.json"
      - name: Activate reviewed deny-by-default policy profile
        run: >-
          armoriq policy propose
          --file deploy/armoriq/policies/openhuman-production.json
          --reason "Version-controlled OpenHuman production policy"
          --activate
          --yes
