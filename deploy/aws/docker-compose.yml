services:
  api:
    image: ${API_IMAGE}
    env_file: ${OPENHUMAN_ENV_FILE:-.env}
    environment:
      COGNEE_DATA_DIR: /app/cognee_data
      GATEWAY_ENABLED: "true"
      OPENHUMAN_API_MODULE: app.main:app
    ports:
      - "8000:8000"
    volumes:
      - cognee_data:/app/cognee_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream-prefix: api

  web:
    image: ${WEB_IMAGE}
    env_file: ${OPENHUMAN_ENV_FILE:-.env}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream-prefix: web

volumes:
  cognee_data:
