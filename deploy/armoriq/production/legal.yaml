# yaml-language-server: $schema=https://docs.armoriq.ai/schemas/armoriq.schema.json
version: v1
identity:
  api_key: $ARMORIQ_API_KEY
  user_id: openhuman-service
  agent_id: openhuman-legal
environment: production
proxy:
  url: https://proxy.armoriq.ai
  timeout: 30
  max_retries: 3
mcp_servers:
  - id: openhuman-legal
    url: $ARMORIQ_LEGAL_MCP_URL
    description: OpenHuman legal and compliance tools with approval boundaries
    auth:
      type: bearer
      token: $ARMORIQ_MCP_BEARER_TOKEN
policy:
  allow:
    - openhuman-legal.review_legal_question
    - openhuman-legal.prepare_legal_document_share
  deny: []
intent:
  ttl_seconds: 360
  require_csrg: true
