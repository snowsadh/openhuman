manifest_version: 1
name: canva
description: Canva MCP — generate, edit, and export designs and presentations (pitch decks, PPTX, PDF, PNG) from natural language
source: https://www.canva.dev/docs/mcp/

transport:
  type: streamable_http
  url: https://mcp.canva.com/mcp

auth:
  type: oauth2
  authorize_url: https://mcp.canva.com/authorize
  token_url: https://mcp.canva.com/token
  scopes: []
  token_auth_method: basic
  supports_refresh: true

tools:
  default_allow: null
  default_deny: []

settings:
  request_timeout_seconds: 30.0
